name: Automação Diária e Proteção Contínua dos Áudios

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  atualizar-e-proteger:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar Dependências Neurais de Áudio
        run: |
          pip install edge-tts

      - name: 🛡️ Verificar e Blindar Integridade dos Áudios Neurais
        run: |
          python scripts/verificar_integridade_audios.py

      - name: ⚡ Executar Gerador de Feed Diário & Semanal
        run: |
          python scripts/gerar_feed_diario.py

      - name: 🚀 Fazer Commit Seguro e Push das Novas Atualizações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed_atualizacao.json audio/*.mp3
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ [Auto-Update] Feed Diário Atualizado & Áudios Neurais Blindados [skip ci]" && git push)
